#:schema https://www.schemastore.org/treefmt.json

excludes = ["@girs/**", "build/**", "node_modules/**"]

[formatter.oxfmt]
command = "oxfmt"
options = ["--write"]
includes = [
  "*.js",
  "*.jsx",
  "*.ts",
  "*.tsx",
  "*.css",
  "*.scss",
  "*.json",
  "*.jsonc",
  "*.yaml",
  "*.toml",
  "*.md",
]

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]
